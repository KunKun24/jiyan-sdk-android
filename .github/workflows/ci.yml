name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Compile shell + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build and test
        run: bash scripts/build-check.sh
